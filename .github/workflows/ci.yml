name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NEXT_PUBLIC_ABLY_API_KEY: ${{ secrets.NEXT_PUBLIC_ABLY_API_KEY }}
      ABLY_BROADCASTING_API_KEY: ${{ secrets.ABLY_BROADCASTING_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      COINBASE_PAYMASTER_RPC_URL: ${{ secrets.COINBASE_PAYMASTER_RPC_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{secrets.SUPABASE_SERVICE_ROLE_KEY}}
      # Sentry configuration
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: gmgmgm
      SENTRY_PROJECT: chessball
      DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
            
    - name: Install dependencies
      run: npm ci
      
    - name: Install frontend dependencies
      run: npm run frontend:install
      
    - name: Compile contracts
      run: npx hardhat compile
      
    - name: Setup PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
      
    - name: Run database migrations
      env:  
        DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres
      run: |
        cd migrations
        ./run-migrations.sh up

      
    - name: Build frontend
      run: npm run build
      
  #  - name: Run linting
  #    run: npm run lint
      
    # - name: Run all Hardhat tests
    #   run: npx hardhat test
    #   env:
    #     DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres
    #     # Use hardhat network for testing - no external RPC needed
    #     HARDHAT_NETWORK: hardhat

    
      
    - name: Generate test coverage report
      env:
        DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres
      run: npm run hardhat:coverage

    - name: DB Migrations down
      env:
        DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres
      run: ./migrations/run-migrations.sh down 000 --force
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: success()
    environment: preview

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install frontend dependencies
      run: npm run frontend:install

    - name: Compile contracts
      run: npx hardhat compile

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Deploy smart contract to testnet
      id: deploy-contract
      env:
        BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        RELAYER_PRIVATE_KEY: ${{ secrets.TESTNET_WALLET_PRIVATE_KEY }}
        TESTNET_WALLET_PRIVATE_KEY: ${{ secrets.TESTNET_WALLET_PRIVATE_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
      run: |
        npx hardhat run scripts/deploy-testnet.ts --network baseSepolia
        
        # Extract contract address from deployment.json using jq (preferred method)
        if [ -f deployment.json ]; then
          # Try baseSepolia.proxyAddress first, then fallback to top-level proxyAddress
          CONTRACT_ADDRESS=$(jq -r '.baseSepolia.proxyAddress' deployment.json 2>/dev/null || echo "")
        fi
        
        if [ -z "$CONTRACT_ADDRESS" ] || [ "$CONTRACT_ADDRESS" = "null" ] || [ "$CONTRACT_ADDRESS" = "" ]; then
          echo "⚠️ Error: Could not extract contract address from deployment"
          exit 1
        fi
        
        echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> $GITHUB_ENV
        echo "✅ Contract deployed to: $CONTRACT_ADDRESS"

    - name: Display contract address
      run: |
        echo "📋 Contract address for this deployment: ${{ env.CONTRACT_ADDRESS }}"
        if [ -z "${{ env.CONTRACT_ADDRESS }}" ]; then
          echo "⚠️ Warning: CONTRACT_ADDRESS is not set"
          exit 1
        fi

    - name: Setup PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create branch database and run migrations
      id: setup-database
      run: |
        # Get branch name and sanitize it for database name
        BRANCH_NAME="${{ github.head_ref }}"
        # Sanitize branch name: lowercase, replace special chars with underscores, remove leading/trailing underscores
        DB_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g' | sed 's/^_*//;s/_*$//' | cut -c1-63)
        
        # If DB_NAME is empty after sanitization, use a default
        if [ -z "$DB_NAME" ]; then
          DB_NAME="preview_$(date +%s)"
        fi
        
        echo "Branch name: $BRANCH_NAME"
        echo "Database name: $DB_NAME"
        
        ORIGINAL_CONN_STRING="${{ secrets.DB_CONNECTION_STRING }}"
        
        # Create new connection string with the new database name
        # Replace everything after the last / until ? or & or end of line with DB_NAME
        NEW_CONN_STRING=$(echo "$ORIGINAL_CONN_STRING" | sed -E "s|(.*)/[^/?&]*|\1/${DB_NAME}|")
        
        echo "📦 Creating database: $DB_NAME"
        
        # Check if database exists first
        DB_EXISTS=$(psql "$ORIGINAL_CONN_STRING" -tAc "SELECT 1 FROM pg_database WHERE datname='$DB_NAME'" 2>/dev/null || echo "")
        
        if [ "$DB_EXISTS" = "1" ]; then
          echo "Database exists, terminating connections and dropping..."
          # Terminate all active connections to the database (connect to 'postgres' database)
          psql "$ORIGINAL_CONN_STRING" -c "
            SELECT pg_terminate_backend(pg_stat_activity.pid)
            FROM pg_stat_activity
            WHERE pg_stat_activity.datname = '$DB_NAME'
              AND pid <> pg_backend_pid();
          " 2>/dev/null || echo "No active connections to terminate"
          # Wait a moment for connections to close
          sleep 2
          # Drop the database
          psql "$ORIGINAL_CONN_STRING" -c "DROP DATABASE IF EXISTS \"$DB_NAME\";"
        fi
        
        # Create the database (will only run if it doesn't exist or was successfully dropped)
        psql "$ORIGINAL_CONN_STRING" -c "CREATE DATABASE \"$DB_NAME\";"
        
        # Set as environment variable
        echo "NEW_DB_CONNECTION_STRING=$NEW_CONN_STRING" >> $GITHUB_ENV
        echo "✅ New database created: $DB_NAME"
        echo "✅ New connection string set"
        
        # Run migrations on the new database
        echo "🔄 Running migrations on database: $DB_NAME"
        cd migrations
        DB_CONNECTION_STRING="$NEW_CONN_STRING" ./run-migrations.sh up
        
        echo "✅ Migrations completed successfully"
      env:
        DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

    - name: Deploy to Vercel
      id: vercel-deploy
      run: |
        # Get commit author information from git (from the actual commit, not merge commit)
        git log -10 >> git_log.txt

        echo "Git log:"
        cat git_log.txt

        COMMIT_AUTHOR_NAME=$(git log -1 --format='%an')
        COMMIT_AUTHOR_EMAIL=$(git log -1 --format='%ae')
        COMMIT_SHA=$(git rev-parse HEAD)
        COMMIT_MESSAGE=$(git log -1 --format='%s')
        BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
        
        echo "📦 Deploying to Vercel with:"
        echo "  Branch: $BRANCH_NAME"
        echo "  Commit: $COMMIT_SHA"
        echo "  Commit Message: $COMMIT_MESSAGE"
        echo "  Author: $COMMIT_AUTHOR_NAME <$COMMIT_AUTHOR_EMAIL>"
        
        # Deploy with explicit metadata using -m flags
        # Format: -m key=value (no quotes needed for values without spaces)
        # Vercel outputs the deployment URL to stdout
        PREVIEW_URL=$(vercel deploy \
          --token=${{ secrets.VERCEL_TOKEN }} \
          -m githubCommitRef=$BRANCH_NAME \
          -m githubCommitSha=$COMMIT_SHA \
          -m githubCommitAuthorName="$COMMIT_AUTHOR_NAME" \
          -m githubCommitAuthorEmail="$COMMIT_AUTHOR_EMAIL" \
          -m githubCommitMessage="$COMMIT_MESSAGE" \
          -e DB_CONNECTION_STRING="${{ env.NEW_DB_CONNECTION_STRING }}" \
          -e CONTRACT_ADDRESS="${{ env.CONTRACT_ADDRESS }}" \
          -e NEXT_PUBLIC_CONTRACT_ADDRESS="${{ env.CONTRACT_ADDRESS }}")
        
        echo "✅ Preview URL: $PREVIEW_URL"
        echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
      env:
        VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        # Also set as environment variables as fallback
        VERCEL_GIT_COMMIT_REF: ${{ github.head_ref || github.ref_name }}
        VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}

    - name: Comment PR with Vercel Preview
      if: steps.vercel-deploy.outputs.preview_url != ''
      uses: actions/github-script@v7
      with:
        script: |
          const previewUrl = '${{ steps.vercel-deploy.outputs.preview_url }}';
          const prNumber = context.payload.pull_request.number;
          const commentBody = `## 🚀 Vercel Preview Deployment
          
          Preview deployment is ready:
          
          **🔗 [View Preview](${previewUrl})**
          
          ${previewUrl}`;
          
          // Find existing comment with Vercel preview
          const comments = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: prNumber,
          });
          
          const existingComment = comments.data.find(comment => 
            comment.body.includes('## 🚀 Vercel Preview Deployment') &&
            comment.user.type === 'Bot'
          );
          
          if (existingComment) {
            // Update existing comment
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existingComment.id,
              body: commentBody,
            });
            console.log('Updated existing Vercel preview comment');
          } else {
            // Create new comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody,
            });
            console.log('Created new Vercel preview comment');
          }
