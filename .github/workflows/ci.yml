name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    environment: test

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      NEXT_PUBLIC_ABLY_API_KEY: ${{ secrets.NEXT_PUBLIC_ABLY_API_KEY }}
      ABLY_BROADCASTING_API_KEY: ${{ secrets.ABLY_BROADCASTING_API_KEY }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      COINBASE_PAYMASTER_RPC_URL: ${{ secrets.COINBASE_PAYMASTER_RPC_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{secrets.SUPABASE_SERVICE_ROLE_KEY}}
      # Sentry configuration
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: gmgmgm
      SENTRY_PROJECT: chessball
      DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
            
    - name: Install dependencies
      run: npm ci
      
    - name: Install frontend dependencies
      run: npm run frontend:install
      
    - name: Compile contracts
      run: npx hardhat compile
      
    - name: Setup PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client
      
    - name: Run database migrations
      env:  
        DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres
      run: |
        cd migrations
        ./run-migrations.sh up

      
    - name: Build frontend
      run: npm run build
      
  #  - name: Run linting
  #    run: npm run lint
      
    # - name: Run all Hardhat tests
    #   run: npx hardhat test
    #   env:
    #     DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres
    #     # Use hardhat network for testing - no external RPC needed
    #     HARDHAT_NETWORK: hardhat

    
      
    - name: Generate test coverage report
      env:
        DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres
      run: npm run hardhat:coverage

    - name: DB Migrations down
      env:
        DB_CONNECTION_STRING: postgres://postgres:postgres@localhost:5432/postgres
      run: ./migrations/run-migrations.sh down 000 --force
      
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        file: ./coverage/lcov.info
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: test
    if: success()
    environment: preview

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install frontend dependencies
      run: npm run frontend:install

    - name: Compile contracts
      run: npx hardhat compile

    - name: Install Vercel CLI
      run: npm install --global vercel@latest

    - name: Deploy smart contract to testnet
      id: deploy-contract
      env:
        BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
        RELAYER_PRIVATE_KEY: ${{ secrets.TESTNET_WALLET_PRIVATE_KEY }}
        TESTNET_WALLET_PRIVATE_KEY: ${{ secrets.TESTNET_WALLET_PRIVATE_KEY }}
      run: |
        npx hardhat run scripts/deploy-testnet.ts --network baseSepolia
        
        # Extract contract address from deployment.json using jq (preferred method)
        if [ -f deployment.json ]; then
          # Try baseSepolia.proxyAddress first, then fallback to top-level proxyAddress
          CONTRACT_ADDRESS=$(jq -r '.baseSepolia.proxyAddress' deployment.json 2>/dev/null || echo "")
        fi
        
        if [ -z "$CONTRACT_ADDRESS" ] || [ "$CONTRACT_ADDRESS" = "null" ] || [ "$CONTRACT_ADDRESS" = "" ]; then
          echo "⚠️ Error: Could not extract contract address from deployment"
          exit 1
        fi
        
        echo "CONTRACT_ADDRESS=$CONTRACT_ADDRESS" >> $GITHUB_ENV
        echo "✅ Contract deployed to: $CONTRACT_ADDRESS"

    - name: Display contract address
      run: |
        echo "📋 Contract address for this deployment: ${{ env.CONTRACT_ADDRESS }}"
        if [ -z "${{ env.CONTRACT_ADDRESS }}" ]; then
          echo "⚠️ Warning: CONTRACT_ADDRESS is not set"
          exit 1
        fi

    - name: Setup PostgreSQL client
      run: |
        sudo apt-get update
        sudo apt-get install -y postgresql-client

    - name: Create branch database and run migrations
      id: setup-database
      run: |
        # Get branch name and sanitize it for database name
        BRANCH_NAME="${{ github.head_ref }}"
        # Sanitize branch name: lowercase, replace special chars with underscores, remove leading/trailing underscores
        DB_NAME=$(echo "$BRANCH_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g' | sed 's/^_*//;s/_*$//' | cut -c1-63)
        
        # If DB_NAME is empty after sanitization, use a default
        if [ -z "$DB_NAME" ]; then
          DB_NAME="preview_$(date +%s)"
        fi
        
        echo "Branch name: $BRANCH_NAME"
        echo "Database name: $DB_NAME"
        
        # Parse existing DB_CONNECTION_STRING
        # Format: postgres://user:password@host:port/database?params
        ORIGINAL_CONN_STRING="${{ secrets.DB_CONNECTION_STRING }}"
        
        # Remove postgres:// prefix and query parameters
        CONN_PART=$(echo "$ORIGINAL_CONN_STRING" | sed 's|^postgres://||' | sed 's|?.*$||')
        
        # Extract user:password (handle passwords with special chars)
        USER_PASS=$(echo "$CONN_PART" | cut -d'@' -f1)
        DB_USER=$(echo "$USER_PASS" | cut -d':' -f1)
        # Get everything after first colon as password (in case password contains colons)
        DB_PASSWORD=$(echo "$USER_PASS" | sed "s/^${DB_USER}://")
        
        # Extract host:port/database
        HOST_PORT_DB=$(echo "$CONN_PART" | cut -d'@' -f2-)
        DB_HOST=$(echo "$HOST_PORT_DB" | cut -d':' -f1)
        PORT_DB=$(echo "$HOST_PORT_DB" | cut -d':' -f2-)
        DB_PORT=$(echo "$PORT_DB" | cut -d'/' -f1)
        
        # Extract query parameters if they exist (for SSL mode, etc.)
        if echo "$ORIGINAL_CONN_STRING" | grep -q '?'; then
          QUERY_PARAMS=$(echo "$ORIGINAL_CONN_STRING" | sed 's/.*?/?/')
        else
          QUERY_PARAMS=""
        fi
        
        echo "Database host: $DB_HOST"
        echo "Database port: $DB_PORT"
        echo "Database user: $DB_USER"
        
        # Set PGPASSWORD for psql
        export PGPASSWORD="$DB_PASSWORD"
        
        # Create new database
        echo "📦 Creating database: $DB_NAME"
        psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -c "CREATE DATABASE \"$DB_NAME\";" || {
          # If database already exists, drop and recreate
          echo "Database exists, dropping and recreating..."
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -c "DROP DATABASE IF EXISTS \"$DB_NAME\";"
          psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d postgres -c "CREATE DATABASE \"$DB_NAME\";"
        }
        
        # Construct new connection string (append query params if they exist)
        NEW_CONN_STRING="postgres://$DB_USER:$DB_PASSWORD@$DB_HOST:$DB_PORT/$DB_NAME$QUERY_PARAMS"
        
        # Set as environment variable
        echo "NEW_DB_CONNECTION_STRING=$NEW_CONN_STRING" >> $GITHUB_ENV
        echo "✅ New database created: $DB_NAME"
        echo "✅ New connection string set"
        
        # Run migrations on the new database
        echo "🔄 Running migrations on database: $DB_NAME"
        cd migrations
        DB_CONNECTION_STRING="$NEW_CONN_STRING" ./run-migrations.sh up
        
        echo "✅ Migrations completed successfully"
      env:
        DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}

    - name: Pull Vercel Environment Information
      run: |
        cd frontend
        vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      env:
        VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

    - name: Update environment variables for deployment
      run: |
        cd frontend
        # Update or add DB_CONNECTION_STRING and CONTRACT_ADDRESS in the env file
        ENV_FILE=".vercel/.env.preview.local"
        
        # Remove existing lines if they exist, then add new ones
        if [ -f "$ENV_FILE" ]; then
          # Remove existing DB_CONNECTION_STRING, CONTRACT_ADDRESS, and NEXT_PUBLIC_CONTRACT_ADDRESS lines
          sed -i.bak '/^DB_CONNECTION_STRING=/d' "$ENV_FILE" 2>/dev/null || true
          sed -i.bak '/^CONTRACT_ADDRESS=/d' "$ENV_FILE" 2>/dev/null || true
          sed -i.bak '/^NEXT_PUBLIC_CONTRACT_ADDRESS=/d' "$ENV_FILE" 2>/dev/null || true
          rm -f "${ENV_FILE}.bak" 2>/dev/null || true
        else
          # Create the file if it doesn't exist
          mkdir -p .vercel
          touch "$ENV_FILE"
        fi
        
        # Append the new values
        echo "DB_CONNECTION_STRING=${{ env.NEW_DB_CONNECTION_STRING }}" >> "$ENV_FILE"
        echo "CONTRACT_ADDRESS=${{ env.CONTRACT_ADDRESS }}" >> "$ENV_FILE"
        echo "NEXT_PUBLIC_CONTRACT_ADDRESS=${{ env.CONTRACT_ADDRESS }}" >> "$ENV_FILE"
        
        echo "✅ Updated environment variables:"
        echo "   - DB_CONNECTION_STRING"
        echo "   - CONTRACT_ADDRESS"
        echo "   - NEXT_PUBLIC_CONTRACT_ADDRESS"

    - name: Deploy to Vercel
      id: vercel-deploy
      run: |
        cd frontend
        vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --branch=${{ github.head_ref }}
      env:
        VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

