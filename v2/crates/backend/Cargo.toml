[package]
name = "tactiball_backend"
description = "TactiBall v2 backend canister"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tactiball_engine = { path = "../engine", features = ["candid"] }
candid = "0.10"
ic-cdk = "0.20"
ic-cdk-timers = "1"
ic-stable-structures = "0.7"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc"] }
sha3 = { version = "0.12", default-features = false }
sha2 = { version = "0.11", default-features = false }
hex = "0.4"
