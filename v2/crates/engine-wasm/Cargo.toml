[package]
name = "tactiball_engine_wasm"
description = "Browser build of the TactiBall engine (wasm-bindgen), used by the frontend for move planning"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tactiball_engine = { path = "../engine" }
serde = { version = "1", features = ["derive"] }
# Pinned: the wasm-bindgen CLI used by scripts/build-engine-wasm.sh must match exactly.
wasm-bindgen = "=0.2.129"
serde-wasm-bindgen = "0.6.5"
